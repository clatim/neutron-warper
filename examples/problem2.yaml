domain:
  size: [1, 1]
  boundary_conditions:
    xmin: 0
    xmax: 0
    ymin: 0
    ymax: 1

mesh:
  x: 
    spacing: 
      - [0.0, 1.0, 0.25]

  y: 
    spacing: 
      - [0.0, 1.0, 0.25]

materials:
  air:
    D: 1.0
    sigt: 1.0
  another:
    D: 1.0
    sigt: 1.0
    fixed_source: 1.0

regions:
  - shape: box
    bounds: [0, 0, 1, 1]
    material: air 

  - shape: box
    bounds: [0.25, 0.25, 0.75, 0.75]
    material: another
