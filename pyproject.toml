[project]
name = "nwarper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipython>=9.10.0",
    "omegaconf>=2.3.0",
    "pyvista>=0.47.0",
